// ==================== 状态 ====================
let state = {
  loggedIn: false,
  categories: FALLBACK_DATA.categories,
  products: [],
  currentCategoryId: 'power_mgmt',
  currentKindKey: '',
  loading: true,
  message: null,
  messageType: null,
  modal: null,
  uploadModal: null,
  uploadCategory: '',
  uploadKind: '',
  uploadPreview: [],
  uploadFileName: '',
  readOnly: false
};

// ==================== 初始化 ====================
function init() {
  const saved = sessionStorage.getItem('krodosen_admin_login');
  if (saved === '1') state.loggedIn = true;
  render();
  if (state.loggedIn) loadData();
}

async function loadData() {
  state.loading = true;
  state.readOnly = false;
  render();

  if (!SUPABASE_URL || !SUPABASE_KEY || SUPABASE_URL.includes('YOUR_PROJECT')) {
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.loading = false;
    showMessage('当前使用内嵌示例数据（本地模式，可编辑但刷新后会重置）。请在 admin.html 中填入 KRODOSEN 项目的 SUPABASE_URL 和 SUPABASE_KEY 后启用数据库持久化。', 'info');
    render();
    return;
  }

  if (!_supabaseClient) {
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 100));
      if (initSupabaseClient()) break;
      if (window.__supabaseLoadFailed) break;
    }
  }
  if (!_supabaseClient) {
    const reason = window.__supabaseLoadFailed ? 'CDN 加载失败' : 'SDK 加载超时';
    showMessage('Supabase 未就绪（' + reason + '），已切换到内嵌示例数据（只读）', 'error');
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.readOnly = true;
    state.loading = false;
    render();
    return;
  }
  try {
    const [{ data: cats, error: err1 }, { data: prods, error: err2 }] = await Promise.all([
      _supabaseClient.from('categories').select('*'),
      _supabaseClient.from('products').select('*')
    ]);
    if (err1) throw err1;
    if (err2) throw err2;
    state.categories = (cats || []).map(c => {
      let kindsConfig = c.kinds_config;
      if (!kindsConfig && c.config) {
        if (Array.isArray(c.config.filters)) {
          kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: c.config.filters }] };
        } else if (c.config.kinds) {
          kindsConfig = c.config;
        } else {
          kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: [] }] };
        }
      }
      if (!kindsConfig) {
        kindsConfig = { kinds: [{ key: 'default', name: c.name || c.display_name, filters: [] }] };
      }
      return {
        ...c,
        display_name: c.display_name || c.name,
        kinds_config: kindsConfig
      };
    });
    state.products = (prods || []).map(p => ({
      ...p,
      kind: p.kind || 'default'
    }));
    initCategoryAndKind();
  } catch (e) {
    console.error(e);
    showMessage('数据库连接失败：' + e.message + '，已切换到内嵌示例数据（只读）', 'error');
    state.categories = FALLBACK_DATA.categories;
    state.products = FALLBACK_DATA.products.slice();
    initCategoryAndKind();
    state.readOnly = true;
  }
  state.loading = false;
  render();
}

function initCategoryAndKind() {
  if (!state.categories.length) return;
  const cat = state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
  state.currentCategoryId = cat.id;
  const kinds = cat.kinds_config?.kinds || [];
  state.currentKindKey = kinds.length ? kinds[0].key : '';
}

function getCategory() {
  return state.categories.find(c => c.id === state.currentCategoryId) || state.categories[0];
}
function getKinds() {
  return getCategory()?.kinds_config?.kinds || [];
}
function getCurrentKind() {
  return getKinds().find(k => k.key === state.currentKindKey) || getKinds()[0];
}
function getFilteredProducts() {
  return state.products.filter(p => p.category === state.currentCategoryId && p.kind === state.currentKindKey);
}

function showMessage(text, type) {
  state.message = text;
  state.messageType = type;
  render();
  setTimeout(() => { state.message = null; render(); }, 6000);
}

// ==================== 登录 ====================
function login(password) {
  if (password === undefined) {
    const input = document.getElementById('pwd');
    password = input ? input.value : '';
  }
  if (password === ADMIN_PASSWORD) {
    state.loggedIn = true;
    sessionStorage.setItem('krodosen_admin_login', '1');
    loadData();
  } else {
    showMessage('密码错误', 'error');
    render();
  }
}
function logout() {
  state.loggedIn = false;
  sessionStorage.removeItem('krodosen_admin_login');
  render();
}

// ==================== 产品 CRUD ====================
function openAddModal() {
  const kind = getCurrentKind();
  if (!kind) return;
  state.modal = {
    mode: 'add',
    product: {
      category: state.currentCategoryId,
      kind: kind.key,
      model: '',
      manufacturer: '',
      image_url: '',
      price: '',
      datasheet_url: '',
      remarks: '',
      spec_data: {}
    }
  };
  render();
}
function openEditModal(product) {
  state.modal = {
    mode: 'edit',
    product: { ...product, spec_data: { ...product.spec_data } }
  };
  render();
}
function closeModal() {
  state.modal = null;
  render();
}
function updateSpecField(key, value) {
  state.modal.product.spec_data[key] = value;
  render();
}
function updateProductField(key, value) {
  state.modal.product[key] = value;
  render();
}
async function saveProduct() {
  const p = state.modal.product;
  if (!p.model || !p.manufacturer) {
    showMessage('型号和制造商为必填项', 'error');
    return;
  }
  if (state.readOnly) {
    showMessage('当前为只读模式，无法保存', 'error');
    return;
  }

  if (!SUPABASE_URL || !SUPABASE_KEY || !_supabaseClient || SUPABASE_URL.includes('YOUR_PROJECT')) {
    if (state.modal.mode === 'add') {
      const newId = state.products.length ? Math.max(...state.products.map(x => x.id || 0)) + 1 : 1;
      state.products.push({
        id: newId,
        category: p.category,
        kind: p.kind,
        model: p.model,
        manufacturer: p.manufacturer,
        spec_data: p.spec_data,
        price: p.price,
        datasheet_url: p.datasheet_url,
        image_url: p.image_url,
        remarks: p.remarks
      });
      showMessage('添加成功（本地模式）', 'success');
    } else {
      const idx = state.products.findIndex(x => x.id === p.id);
      if (idx >= 0) {
        state.products[idx] = {
          id: p.id,
          category: p.category,
          kind: p.kind,
          model: p.model,
          manufacturer: p.manufacturer,
          spec_data: p.spec_data,
          price: p.price,
          datasheet_url: p.datasheet_url,
          image_url: p.image_url,
          remarks: p.remarks
        };
        showMessage('更新成功（本地模式）', 'success');
      } else {
        showMessage('未找到要更新的产品', 'error');
        return;
      }
    }
    state.modal = null;
    render();
    return;
  }

  const payload = {
    category: p.category,
    kind: p.kind,
    model: p.model,
    manufacturer: p.manufacturer,
    spec_data: p.spec_data,
    price: p.price,
    datasheet_url: p.datasheet_url,
    image_url: p.image_url,
    remarks: p.remarks
  };
  try {
    if (state.modal.mode === 'add') {
      const { error } = await _supabaseClient.from('products').insert(payload);
      if (error) throw error;
      showMessage('添加成功', 'success');
    } else {
      const { error } = await _supabaseClient.from('products').update(payload).eq('id', p.id);
      if (error) throw error;
      showMessage('更新成功', 'success');
    }
    state.modal = null;
    await loadData();
  } catch (e) {
    showMessage('保存失败：' + e.message, 'error');
  }
}
async function deleteProduct(id) {
  if (!confirm('确定删除这条产品？')) return;
  if (state.readOnly) {
    showMessage('当前为只读模式，无法删除', 'error');
    return;
  }

  if (!SUPABASE_URL || !SUPABASE_KEY || !_supabaseClient || SUPABASE_URL.includes('YOUR_PROJECT')) {
    state.products = state.products.filter(x => x.id !== id);
    showMessage('删除成功（本地模式）', 'success');
    render();
    return;
  }

  try {
    const { error } = await _supabaseClient.from('products').delete().eq('id', id);
    if (error) throw error;
    showMessage('删除成功', 'success');
    await loadData();
  } catch (e) {
    showMessage('删除失败：' + e.message, 'error');
  }
}

// ==================== 渲染 ====================
function render() {
  const app = document.getElementById('app');
  if (!state.loggedIn) {
    app.innerHTML = renderLogin();
    return;
  }
  app.innerHTML = renderAdmin();
  bindAdminEvents();
}

function renderLogin() {
  return `
    <div class="login-box">
      <h2>KRODOSEN 可罗道森 后台管理</h2>
      ${state.message ? `<div class="error-msg">${state.message}</div>` : ''}
      <input type="password" id="pwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter') login()">
      <button class="btn btn-primary" onclick="login()">登录</button>
    </div>
  `;
}

function renderAdmin() {
  return `
    <div class="wrap">
      <header>
        <div>
          <h1>KRODOSEN 可罗道森 参数筛选器 - 后台管理</h1>
          <p>管理 电源管理组件、射频芯片组件 型号与参数</p>
        </div>
        <button class="btn btn-default" onclick="openUploadModal()">表格批量上传</button>
        <button class="btn btn-default" onclick="logout()">退出登录</button>
      </header>
      ${state.message ? `<div class="status-tip ${state.messageType}">${state.message}</div>` : ''}
      <div class="cat-bar">
        ${state.categories.map(cat => {
          const active = cat.id === state.currentCategoryId ? 'active' : '';
          return `<button class="cat-btn ${active}" data-id="${cat.id}">${cat.display_name}</button>`;
        }).join('')}
      </div>
      <div class="panel">
        ${state.loading ? '<div class="loading">正在加载数据...</div>' : renderKindPanel()}
      </div>
    </div>
    ${state.modal ? renderModal() : ''}
    ${state.uploadModal ? renderUploadModal() : ''}
  `;
}

function renderKindPanel() {
  const kinds = getKinds();
  const kind = getCurrentKind();
  if (!kind) return '<div class="empty-state">当前分类没有配置子类型</div>';
  const products = getFilteredProducts();
  let kindBar = '';
  if (kinds.length > 1) {
    kindBar = '<div class="kind-bar">' + kinds.map(k => {
      const active = k.key === state.currentKindKey ? 'active' : '';
      return `<button class="kind-btn ${active}" data-key="${k.key}">${k.name}</button>`;
    }).join('') + '</div>';
  }
  return `
    ${kindBar}
    <div class="toolbar">
      <div><strong>${kind.name}</strong>（共 ${products.length} 条）</div>
      <button class="btn btn-primary" onclick="openAddModal()">+ 添加型号</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ID</th><th>型号</th><th>制造商</th>${kind.filters.map(f => `<th>${escapeHtml(f.name)}</th>`).join('')}<th>参考价格</th><th>数据手册</th><th>备注</th><th>操作</th></tr>
        </thead>
        <tbody>
          ${products.length ? products.map(p => `
            <tr>
              <td>${p.id}</td>
              <td><div style="display:flex;align-items:center;gap:6px;">${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid #e0e0e0;cursor:pointer;" onclick="window.open('${escapeHtml(p.image_url)}','_blank')" onerror="this.style.display='none'">` : ''}<span>${escapeHtml(p.model)}</span></div></td>
              <td>${escapeHtml(p.manufacturer)}</td>
              ${kind.filters.map(f => `<td>${escapeHtml(p.spec_data?.[f.key] || '-')}</td>`).join('')}
              <td>${escapeHtml(p.price || '-')}</td>
              <td>${p.datasheet_url ? `<a href="${escapeHtml(p.datasheet_url)}" target="_blank">链接</a>` : '-'}</td><td>${escapeHtml(p.remarks || '-')}</td>
              <td class="actions">
                <button class="btn btn-primary" onclick="openEditModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">编辑</button>
                <button class="btn btn-danger" onclick="deleteProduct(${p.id})">删除</button>
              </td>
            </tr>
          `).join('') : `<tr><td colspan="${4 + kind.filters.length}" class="empty-state">该分类下暂无产品</td></tr>`}
        </tbody>
      </table>
    </div>
  `;
}

function renderModal() {
  const p = state.modal.product;
  const kind = getCurrentKind();
  const title = state.modal.mode === 'add' ? '添加型号' : '编辑型号';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <div class="modal-header">
          <h3>${title}</h3>
          <button class="modal-close" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="form-row">
            <div class="form-group">
              <label>型号 *</label>
              <input type="text" value="${escapeHtml(p.model)}" oninput="updateProductField('model', this.value)">
            </div>
            <div class="form-group">
              <label>制造商 *</label>
              <input type="text" value="${escapeHtml(p.manufacturer)}" oninput="updateProductField('manufacturer', this.value)">
            </div>
          </div>
          <div class="form-row">
            ${kind.filters.map(f => `
              <div class="form-group">
                <label>${escapeHtml(f.name)}</label>
                <input type="text" value="${escapeHtml(p.spec_data?.[f.key] || '')}" oninput="updateSpecField('${f.key}', this.value)">
              </div>
            `).join('')}
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>参考价格</label>
              <input type="text" value="${escapeHtml(p.price)}" oninput="updateProductField('price', this.value)">
            </div>
            <div class="form-group">
              <label>数据手册链接</label>
              <input type="text" value="${escapeHtml(p.datasheet_url)}" oninput="updateProductField('datasheet_url', this.value)">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>产品图片链接（外链 URL，留空则不显示图片）</label>
              <input type="text" value="${escapeHtml(p.image_url || '')}" oninput="updateProductField('image_url', this.value)" placeholder="https://example.com/product.jpg">
              ${p.image_url ? `<img src="${escapeHtml(p.image_url)}" alt="预览" style="margin-top:8px;max-width:140px;max-height:140px;border-radius:6px;border:1px solid #e0e0e0;" onerror="this.outerHTML='<span style=&quot;color:#999;font-size:12px;&quot;>图片链接无效</span>'">` : '<div style="margin-top:8px;color:#999;font-size:12px;">未设置图片</div>'}
            </div>
          </div>
          <div class="form-row">
            <div class="form-group full">
              <label>备注</label>
              <textarea rows="2" oninput="updateProductField('remarks', this.value)" placeholder="可选备注信息">${escapeHtml(p.remarks || '')}</textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveProduct()">保存</button>
        </div>
      </div>
    </div>
  `;
}

function bindAdminEvents() {
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentCategoryId = btn.dataset.id;
      initCategoryAndKind();
      render();
    });
  });
  document.querySelectorAll('.kind-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.currentKindKey = btn.dataset.key;
      render();
    });
  });
}

function escapeHtml(text) {
  if (text === null || text === undefined) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}


// ==================== 表格批量上传 ====================
function openUploadModal() {
  state.uploadModal = true;
  state.uploadCategory = state.currentCategoryId || (state.categories[0] && state.categories[0].id) || '';
  const kinds = getCatKinds(state.uploadCategory);
  state.uploadKind = (kinds[0] && kinds[0].key) || 'default';
  state.uploadPreview = [];
  state.uploadFileName = '';
  render();
}
function closeUploadModal() {
  state.uploadModal = null;
  state.uploadPreview = [];
  state.uploadFileName = '';
  render();
}
function getCatKinds(catId) {
  const cat = state.categories.find(c => c.id === catId);
  if (!cat) return [];
  return (cat.kinds_config && cat.kinds_config.kinds) ? cat.kinds_config.kinds : [];
}
function getKindFilters(catId, kindKey) {
  const kinds = getCatKinds(catId);
  const kind = kinds.find(k => k.key === kindKey) || kinds[0] || { filters: [] };
  return kind.filters || [];
}
function onUploadCatChange() {
  const sel = document.getElementById('uploadCat');
  state.uploadCategory = sel ? sel.value : '';
  const kinds = getCatKinds(state.uploadCategory);
  state.uploadKind = (kinds[0] && kinds[0].key) || 'default';
  state.uploadPreview = [];
  render();
}
function onUploadKindChange() {
  const sel = document.getElementById('uploadKind');
  state.uploadKind = sel ? sel.value : 'default';
  state.uploadPreview = [];
  render();
}
function downloadTemplate() {
  const catId = state.uploadCategory;
  const kindKey = state.uploadKind;
  if (!catId) { showMessage('请先选择子类型', 'error'); return; }
  const filters = getKindFilters(catId, kindKey);
  const headers = ['型号','制造商','参考价格','图片URL','数据手册URL','备注'].concat(filters.map(f => f.name));
  const csv = '﻿' + headers.join(',') + '\n';
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '上传模板_' + catId + '_' + kindKey + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showMessage('模板已下载，请按表头填写后上传', 'success');
}
function parseCsv(text) {
  const rows = [];
  let row = []; let field = ''; let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQuotes = false; } }
      else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\r') { /* ignore */ }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += ch;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => (c || '').trim() !== ''));
}
function buildProductFromRow(row, headers, catId, kindKey) {
  const filters = getKindFilters(catId, kindKey);
  const get = (cn) => { const idx = headers.indexOf(cn); return idx >= 0 ? (row[idx] || '').trim() : ''; };
  const spec_data = {};
  filters.forEach(f => { const v = get(f.name); if (v) spec_data[f.key] = v; });
  return {
    category: catId,
    kind: kindKey,
    model: get('型号'),
    manufacturer: get('制造商'),
    price: get('参考价格'),
    image_url: get('图片URL'),
    datasheet_url: get('数据手册URL'),
    remarks: get('备注'),
    spec_data
  };
}
function onCsvFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  state.uploadFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    const raw = String(reader.result).replace(/^﻿/, '');
    const rows = parseCsv(raw);
    if (rows.length < 2) { showMessage('文件没有可解析的数据行', 'error'); return; }
    const headers = rows[0].map(h => (h || '').trim());
    const products = rows.slice(1).map(r => buildProductFromRow(r, headers, state.uploadCategory, state.uploadKind));
    state.uploadPreview = products;
    const valid = products.filter(p => p.model && p.manufacturer).length;
    showMessage('已解析 ' + products.length + ' 条，其中 ' + valid + ' 条含型号和制造商', 'info');
    render();
  };
  reader.onerror = () => { showMessage('文件读取失败', 'error'); };
  reader.readAsText(file, 'UTF-8');
}
async function confirmUpload() {
  if (!state.uploadPreview.length) { showMessage('没有可上传的数据', 'error'); return; }
  if (state.readOnly) { showMessage('当前为只读模式，无法上传', 'error'); return; }
  const invalid = state.uploadPreview.filter(p => !p.model || !p.manufacturer);
  if (invalid.length) { showMessage('有 ' + invalid.length + ' 行缺少型号或制造商，请检查后重试', 'error'); return; }
  if (!_supabaseClient) {
    let maxId = state.products.length ? Math.max.apply(null, state.products.map(x => x.id || 0)) : 0;
    state.uploadPreview.forEach(p => { maxId++; state.products.push(Object.assign({ id: maxId }, p)); });
    showMessage('成功添加 ' + state.uploadPreview.length + ' 条（本地模式）', 'success');
    closeUploadModal();
    render();
    return;
  }
  try {
    const payloads = state.uploadPreview.map(p => ({
      category: p.category, kind: p.kind, model: p.model, manufacturer: p.manufacturer,
      spec_data: p.spec_data, price: p.price, image_url: p.image_url, datasheet_url: p.datasheet_url, remarks: p.remarks
    }));
    const { error } = await _supabaseClient.from('products').insert(payloads);
    if (error) throw error;
    showMessage('成功上传 ' + payloads.length + ' 条产品', 'success');
    closeUploadModal();
    await loadData();
  } catch (e) {
    showMessage('上传失败：' + (e.message || JSON.stringify(e)), 'error');
  }
}
function renderUploadModal() {
  const cats = state.categories;
  const kinds = getCatKinds(state.uploadCategory);
  const preview = state.uploadPreview.slice(0, 8);
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeUploadModal()">
      <div class="modal upload-modal">
        <div class="modal-header">
          <h3>表格批量上传产品</h3>
          <button class="modal-close" onclick="closeUploadModal()">×</button>
        </div>
        <div class="modal-body">
          <div class="upload-tip">
            1. 先选择分类与子类型，点 <code>下载模板</code> 获取 CSV 表头；<br>
            2. 在表格中按列填写产品参数（不需要的列留空即可）；<br>
            3. 选好填好的 CSV 文件，确认下方预览无误后点 <code>确认上传</code>。<br>
            注意：CSV 首行必须是表头（中文列名），文件编码 UTF-8。
          </div>
          <div class="upload-controls">
            <select id="uploadCat" onchange="onUploadCatChange()">
              ${cats.map(c => `<option value="${c.id}" ${c.id === state.uploadCategory ? 'selected' : ''}>${escapeHtml(c.display_name)}</option>`).join('')}
            </select>
            <select id="uploadKind" onchange="onUploadKindChange()">
              ${kinds.map(k => `<option value="${escapeHtml(k.key)}" ${k.key === state.uploadKind ? 'selected' : ''}>${escapeHtml(k.name)}</option>`).join('')}
            </select>
            <button class="btn btn-default" onclick="downloadTemplate()">下载模板</button>
            <label class="btn btn-primary" style="margin:0;cursor:pointer;">
              选择 CSV 文件
              <input type="file" accept=".csv,text/csv" style="display:none;" onchange="onCsvFile(event)">
            </label>
            ${state.uploadFileName ? `<span class="file-name">已选：${escapeHtml(state.uploadFileName)}</span>` : ''}
            ${state.uploadPreview.length ? `<span class="preview-count">已解析 ${state.uploadPreview.length} 条</span>` : ''}
          </div>
          ${preview.length ? `
            <div class="preview-wrap">
              <table>
                <thead><tr><th>型号</th><th>制造商</th><th>参考价格</th><th>参数数</th><th>备注</th></tr></thead>
                <tbody>
                  ${preview.map(p => `<tr><td>${escapeHtml(p.model)}</td><td>${escapeHtml(p.manufacturer)}</td><td>${escapeHtml(p.price)}</td><td>${Object.keys(p.spec_data).length}</td><td>${escapeHtml(p.remarks)}</td></tr>`).join('')}
                </tbody>
              </table>
            </div>
            ${state.uploadPreview.length > preview.length ? `<div class="preview-count">… 仅显示前 ${preview.length} 条，共 ${state.uploadPreview.length} 条</div>` : ''}
          ` : ''}
        </div>
        <div class="modal-footer">
          <button class="btn btn-default" onclick="closeUploadModal()">取消</button>
          <button class="btn btn-primary" onclick="confirmUpload()" ${state.uploadPreview.length ? '' : 'disabled'}>确认上传</button>
        </div>
      </div>
    </div>`;
}

init();
</script>
